name: Instalador BateriaSep

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versao"
        default: "1.0.0"
  push:
    branches: [main]

permissions:
  contents: write

env:
  ORT_VERSION: 1.22.0
  WEIGHTS_BASE: https://github.com/openmirlab/mdxnet-infer/releases/download/weights-drumsep-v1
  CKPT_NAME: aufr33-jarredou_DrumSep_model_mdx23c_ep_141_sdr_10.8059

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias Python
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxscript onnxruntime pyyaml numpy

      - name: Baixar pesos e exportar modelo ONNX
        shell: pwsh
        run: |
          curl.exe -L -o drumsep.ckpt "$env:WEIGHTS_BASE/$env:CKPT_NAME.ckpt"
          curl.exe -L -o drumsep.yaml "$env:WEIGHTS_BASE/$env:CKPT_NAME.yaml"
          python tools/export_onnx.py drumsep.ckpt drumsep.yaml drumsep_core.onnx
          if (-not (Test-Path drumsep_core.onnx)) { throw "modelo nao gerado" }
          (Get-Item drumsep_core.onnx).Length

      - name: Baixar ONNX Runtime
        shell: pwsh
        run: |
          curl.exe -L -o ort.zip "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip"
          Expand-Archive ort.zip -DestinationPath ort

      - name: Compilar plugin
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DONNXRUNTIME_ROOT=$PWD/ort/onnxruntime-win-x64-$env:ORT_VERSION"
          cmake --build build --config Release --target BateriaSep_VST3 BateriaSep_Standalone --parallel

      - name: Montar instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          curl.exe -L -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          $versao = "${{ github.event.inputs.versao }}"
          if (-not $versao) { $versao = "1.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersao=$versao" installer\BateriaSep.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }
          Get-ChildItem dist

      - name: Publicar em Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versao = "${{ github.event.inputs.versao }}"
          if (-not $versao) { $versao = "1.0.0" }
          gh release create "v$versao-b${{ github.run_number }}" dist/BateriaSep-Setup.exe --title "BateriaSep $versao" --notes "Instalador para Windows"
